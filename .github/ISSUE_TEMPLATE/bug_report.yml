name: Bug Report
description: Сообщить об ошибке
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что произошло? Что должно было произойти?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть страницу ...
        2. Нажать на ...
        3. Увидеть ошибку
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Окружение
      description: Браузер, ОС, устройство
      placeholder: Chrome 130 / Windows 11

  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты / видео
      description: Если есть
